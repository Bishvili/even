name: Compile Apple Shortcut

on:
  push:
    paths:
      - 'shortcuts/**'
      - '.github/workflows/shortcut-compile.yml'
  pull_request:
    paths:
      - 'shortcuts/**'
      - '.github/workflows/shortcut-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install Cherri 2.3.0
        run: go install github.com/electrikmilk/cherri@v2.3.0
      - name: Compile Rage Tracker Sync
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          cherri shortcuts/rage-tracker-sync.cherri
      - name: Verify compiled Shortcut
        run: |
          test -s shortcuts/rage-tracker-sync.shortcut
