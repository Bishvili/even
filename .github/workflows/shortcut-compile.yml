name: Validate application and Shortcut

on:
  push:
    paths:
      - 'shortcuts/**'
      - 'tests/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'worker/**'
      - 'db/**'
      - '.github/workflows/shortcut-compile.yml'
  pull_request:
    paths:
      - 'shortcuts/**'
      - 'tests/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'worker/**'
      - 'db/**'
      - '.github/workflows/shortcut-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test tests/*.test.cjs

  shortcut-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build Cherri 2.3.0
        run: |
          git clone --depth 1 --branch v2.3.0 https://github.com/electrikmilk/cherri.git /tmp/cherri-source
          (cd /tmp/cherri-source && go build -trimpath -o /tmp/cherri-compiler .)
      - name: Compile Rage Tracker Sync
        run: |
          /tmp/cherri-compiler shortcuts/rage-tracker-sync.cherri --output=/tmp/rage-tracker-compiled.shortcut
      - name: Verify compiled Shortcut
        run: test -s /tmp/rage-tracker-compiled.shortcut
