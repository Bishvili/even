name: Validate application and Shortcut

# Runs on every push, because the tests cover files that a path filter would miss.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: node --test tests/*.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Load every screen with the production security rules
        run: node scripts/smoke.cjs chromium webkit
      - name: Check signed-in flows against a fake API
        run: node scripts/signed-in.cjs chromium webkit

  shortcut-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build Cherri 2.3.0
        run: |
          git clone --depth 1 --branch v2.3.0 https://github.com/electrikmilk/cherri.git /tmp/cherri-source
          (cd /tmp/cherri-source && go build -trimpath -o /tmp/cherri-compiler .)
      - name: Compile Even Sync and Even Release without remote signing
        run: |
          /tmp/cherri-compiler shortcuts/even-sync.cherri --debug --skip-sign --output=/tmp/even-compiled.shortcut
          /tmp/cherri-compiler shortcuts/even-release.cherri --debug --skip-sign --output=/tmp/even-release-compiled.shortcut
      - name: Verify the generated Shortcut plists
        run: |
          find . -type f -name '*.plist' -print
          PLIST="$(find . -type f -name 'Even Sync.plist' -print -quit)"
          test -n "$PLIST"
          test -s "$PLIST"
          python3 scripts/check-shortcut-conditions.py "$PLIST"
          HELPER="$(find . -type f -name 'Even Release.plist' -print -quit)"
          test -n "$HELPER"
          test -s "$HELPER"
          python3 scripts/check-shortcut-conditions.py --helper "$HELPER"
