name: Publish Even Sync

on:
  workflow_dispatch:
    inputs:
      icloud_link:
        description: "iCloud link to the installed Shortcut"
        type: string
        required: true
      changes:
        description: "Release notes (plain text, no emojis). Leave empty to use shortcuts/release-notes.txt."
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: even-sync-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and validate the release
        id: release
        env:
          ICLOUD_LINK: ${{ inputs.icloud_link }}
          RELEASE_CHANGES: ${{ inputs.changes }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          link = os.environ["ICLOUD_LINK"].strip()
          source = Path("shortcuts/even-sync.cherri").read_text()

          if not re.fullmatch(r"https://www\.icloud\.com/shortcuts/[a-fA-F0-9]{32}", link):
              raise SystemExit("A valid Apple iCloud share link is required.")
          versions = set(re.findall(r'"shortcutVersion": "(\d+\.\d+\.\d+)"', source))
          if len(versions) != 1:
              raise SystemExit("The Shortcut source has inconsistent versions.")
          if re.search(r"Bearer [a-fA-F0-9]{64}", source):
              raise SystemExit("Credential detected in Shortcut source. Refusing release.")
          # The notes are committed with the version bump, so every release says what changed.
          notes_file = Path("shortcuts/release-notes.txt")
          notes = os.environ.get("RELEASE_CHANGES", "").strip() or (notes_file.read_text().strip() if notes_file.exists() else "")
          notes = " ".join(notes.split())[:180] or "Bug fixes and improvements."
          Path(os.environ["RUNNER_TEMP"], "release-notes.txt").write_text(notes)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={versions.pop()}\n")
          PY

      - name: Record the release so the app and Shortcut offer it
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ICLOUD_LINK: ${{ inputs.icloud_link }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          Path("shortcuts/release.json").write_text(json.dumps({
              "version": os.environ["RELEASE_VERSION"],
              "url": os.environ["ICLOUD_LINK"].strip(),
              "publishedAt": datetime.date.today().isoformat(),
              "notes": Path(os.environ["RUNNER_TEMP"], "release-notes.txt").read_text()[:180],
              "verified": True,
          }, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortcuts/release.json
          git commit -m "release: Even Sync ${RELEASE_VERSION}"
          git pull --rebase origin main
          git push origin main
