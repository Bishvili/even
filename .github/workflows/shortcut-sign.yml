name: Build signed Even Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shortcut-sign.yml
      - shortcuts/**
      - scripts/check-shortcut-conditions.py
      - tests/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-shortcut:
    name: Validate and sign Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Check the distributed source contains no configured bearer token
        run: |
          if grep -Eiq 'Bearer [a-f0-9]{64}' shortcuts/even-sync.cherri shortcuts/even-release.cherri; then
            echo 'Refusing to sign a Shortcut containing a configured device key.' >&2
            exit 1
          fi

      - name: Build pinned Cherri compiler
        run: |
          git clone --depth 1 --branch v2.3.0 https://github.com/electrikmilk/cherri.git /tmp/cherri-source
          (cd /tmp/cherri-source && go build -trimpath -o /tmp/cherri-compiler .)

      - name: Compile Sync and verify all If comparisons
        run: |
          /tmp/cherri-compiler shortcuts/even-sync.cherri --debug --derive-uuids --skip-sign --output=/tmp/even-sync-unsigned.shortcut
          PLIST="$(find . -type f -name 'Even Sync.plist' -print -quit)"
          test -n "$PLIST"
          python3 scripts/check-shortcut-conditions.py "$PLIST"
          mkdir -p dist
          cp "$PLIST" dist/compiled-sync.plist

      - name: Upload compiled plists for structural diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Even-Sync-compiled-plists
          path: dist/*.plist
          if-no-files-found: error
          retention-days: 3

      - name: Sign the Shortcut using Cherri HubSign
        run: |
          sign_one() {
            local input="$1" output="$2" attempt
            for attempt in 1 2 3; do
              if /tmp/cherri-compiler "$input" --derive-uuids --hubsign --share=anyone --output="$output"; then
                return 0
              fi
              rm -f "$output"
              echo "Signing attempt $attempt failed; retrying if attempts remain." >&2
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            return 1
          }
          sign_one shortcuts/even-sync.cherri "$GITHUB_WORKSPACE/dist/Even Sync.shortcut"
          sign_one shortcuts/even-release.cherri "$GITHUB_WORKSPACE/dist/Even Release.shortcut"

      - name: Verify the signed files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = ["Even Sync.shortcut", "Even Release.shortcut"]
          for name in expected:
              signed = Path("dist") / name
              data = signed.read_bytes()
              if len(data) < 512 or not data.startswith(b"AEA1"):
                  raise SystemExit(f"Missing or invalid signed Apple Shortcut: {name}")
              print(f"Signed: {name} ({len(data)} bytes)")
          PY
          sha256sum dist/*.shortcut

      - name: Upload the iPhone installer
        uses: actions/upload-artifact@v4
        with:
          name: Even-Sync-iPhone-Installer
          path: dist/*.shortcut
          if-no-files-found: error
          retention-days: 7

      - name: Post the builds at fixed download links
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shortcut-latest >/dev/null 2>&1 || gh release create shortcut-latest --title "Latest Shortcut builds" --notes "Signed builds from main." --prerelease
          cp "dist/Even Sync.shortcut" dist/Even-Sync.shortcut
          cp "dist/Even Release.shortcut" dist/Even-Release.shortcut
          gh release upload shortcut-latest dist/Even-Sync.shortcut dist/Even-Release.shortcut --clobber
