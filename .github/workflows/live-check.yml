name: Check the live site
on:
  push:
    branches: [main]
concurrency:
  group: live-check
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Wait for this version to go live
        run: |
          version=$(sed -n 's/^var VERSION = "\(.*\)";.*/\1/p' app.js)
          for attempt in $(seq 1 40); do
            live=$(curl -fsS https://health.bishvili.org/api/status | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            if [ "$live" = "$version" ]; then echo "Live on $version"; exit 0; fi
            sleep 15
          done
          echo "::error::The live site is on '$live', not $version"
          exit 1
      - name: Check what the live site serves
        run: |
          for path in / /styles.css /app.js /sw.js /manifest.webmanifest /icon.svg /icon-180.png /launch-390x844-3-dark.png /whitepaper.html; do
            curl -fsS --max-time 20 -o /dev/null "https://health.bishvili.org$path" || { echo "::error::$path didn't load"; exit 1; }
          done
          curl -fsSI --max-time 20 https://health.bishvili.org/ | grep -qi '^content-security-policy'
          code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' https://sync.bishvili.org/)
          test "$code" = "404" || { echo "::error::The Shortcuts' address served a page ($code)"; exit 1; }
          curl -fsS --max-time 30 -D - -o /dev/null https://sync.bishvili.org/api/shortcut/build/helper | grep -qi 'filename="'
