name: Verify RoutineHub GitHub secret (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/routinehub-connection-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-routinehub-connection:
    name: Verify account owns Rage Tracker Sync #26978
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check developer API access without changing releases
        env:
          ROUTINEHUB_API_KEY: ${{ secrets.ROUTINEHUB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib import parse, request

          secret = os.environ.get("ROUTINEHUB_API_KEY", "").strip()
          if len(secret) != 40:
              raise SystemExit("ROUTINEHUB_API_KEY is missing or not a valid developer API key.")
          api = "https://routinehub.co/api/v1/" + parse.quote(secret, safe="") + "/shortcuts"

          try:
              with request.urlopen(request.Request(api, method="GET"), timeout=25) as response:
                  data = json.loads(response.read(32768))
          except Exception:
              # Never include an exception or URL in logs: the key is in the API path.
              raise SystemExit("RoutineHub read-only API check failed; verify the key and account.")

          if data.get("result") != "success":
              raise SystemExit("RoutineHub rejected the configured developer API key.")
          shortcuts = data.get("shortcuts", {})
          if not isinstance(shortcuts, dict) or not any(
              isinstance(item, dict) and str(item.get("id")) == "26978"
              for item in shortcuts.values()
          ):
              raise SystemExit("This RoutineHub key does not own Rage Tracker Sync listing #26978.")

          print("RoutineHub developer key verified for Rage Tracker Sync #26978.")
          print("Read-only verification complete. No releases or listings were modified.")
          PY
