name: Build signed Shortcut v2.3 candidate

on:
  push:
    branches:
      - release/shortcut-v23-candidate
    paths:
      - .github/workflows/shortcut-v23-signed-candidate.yml
      - shortcuts/rage-tracker-sync.cherri
      - scripts/check-shortcut-conditions.py
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate:
    name: Compile, verify, and sign an unconfigured candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Verify source contains no configured device bearer key
        run: |
          if grep -Eiq 'Bearer [a-f0-9]{64}' shortcuts/rage-tracker-sync.cherri; then
            echo 'Refusing to sign a Shortcut containing a configured device key.' >&2
            exit 1
          fi

      - name: Build pinned Cherri compiler
        run: |
          git clone --depth 1 --branch v2.3.0 https://github.com/electrikmilk/cherri.git /tmp/cherri-source
          (cd /tmp/cherri-source && go build -trimpath -o /tmp/cherri-compiler .)

      - name: Compile and check all six If comparisons
        run: |
          /tmp/cherri-compiler shortcuts/rage-tracker-sync.cherri --debug --derive-uuids --skip-sign --output=/tmp/rage-tracker-unsigned.shortcut
          PLIST="$(find . -type f -name 'Rage Tracker Sync.plist' -print -quit)"
          test -n "$PLIST"
          python3 scripts/check-shortcut-conditions.py "$PLIST"

      - name: Copy generated plist for structural analysis
        run: |
          mkdir -p dist
          PLIST="$(find . -type f -name 'Rage Tracker Sync.plist' -print -quit)"
          test -n "$PLIST"
          cp "$PLIST" dist/compiled-shortcut.plist

      - name: Upload unconfigured compiled plist for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Rage-Tracker-Sync-compiled-plist
          path: dist/compiled-shortcut.plist
          if-no-files-found: error
          retention-days: 3

      - name: Sign generic Shortcut with Cherri HubSign
        run: |
          mkdir -p dist
          /tmp/cherri-compiler shortcuts/rage-tracker-sync.cherri --derive-uuids --hubsign --share=anyone --output="$GITHUB_WORKSPACE/dist/Rage-Tracker-Sync-v2.3.0.shortcut"

      - name: Verify candidate is signed and nonempty
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidate = Path("dist/Rage-Tracker-Sync-v2.3.0.shortcut")
          data = candidate.read_bytes()
          if len(data) < 512:
              raise SystemExit("The candidate Shortcut is unexpectedly small")
          if not data.startswith(b"AEA1"):
              raise SystemExit("The candidate is not a signed Apple Encrypted Archive (AEA1). Do not distribute it.")
          print(f"Signed candidate ready for on-device testing ({len(data)} bytes)")
          PY
          sha256sum dist/Rage-Tracker-Sync-v2.3.0.shortcut

      - name: Upload candidate for private device acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: Rage-Tracker-Sync-v2.3.0-UNVERIFIED
          path: dist/Rage-Tracker-Sync-v2.3.0.shortcut
          if-no-files-found: error
          retention-days: 7
