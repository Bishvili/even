name: Publish Rage Tracker Sync to RoutineHub

on:
  workflow_dispatch:
    inputs:
      icloud_link:
        description: "iCloud link to the installed Shortcut"
        type: string
        required: true
      changes:
        description: "Release notes (plain text, no emojis)"
        type: string
        required: false
        default: "Bug fixes and improvements."

permissions:
  contents: write

concurrency:
  group: routinehub-release
  cancel-in-progress: false

jobs:
  routinehub-release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and validate the release
        id: release
        env:
          ICLOUD_LINK: ${{ inputs.icloud_link }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          link = os.environ["ICLOUD_LINK"].strip()
          source = Path("shortcuts/rage-tracker-sync.cherri").read_text()

          if not re.fullmatch(r"https://www\.icloud\.com/shortcuts/[a-fA-F0-9]{32}", link):
              raise SystemExit("A valid Apple iCloud share link is required.")
          versions = set(re.findall(r'"shortcutVersion": "(\d+\.\d+\.\d+)"', source))
          if len(versions) != 1:
              raise SystemExit("The Shortcut source has inconsistent versions.")
          if re.search(r"Bearer [a-fA-F0-9]{64}", source):
              raise SystemExit("Credential detected in Shortcut source. Refusing release.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={versions.pop()}\n")
          PY

      - name: Create RoutineHub version
        env:
          ROUTINEHUB_API_KEY: ${{ secrets.ROUTINEHUB_API_KEY }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ICLOUD_LINK: ${{ inputs.icloud_link }}
          RELEASE_CHANGES: ${{ inputs.changes }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib import error, parse, request

          key = os.environ.get("ROUTINEHUB_API_KEY", "")
          if not key:
              raise SystemExit("Missing GitHub secret: ROUTINEHUB_API_KEY")
          url = "https://routinehub.co/api/v1/" + parse.quote(key, safe="") + "/shortcuts/26978/versions/create"
          body = parse.urlencode({
              "version": os.environ["RELEASE_VERSION"],
              "link": os.environ["ICLOUD_LINK"].strip(),
              "changes": os.environ["RELEASE_CHANGES"],
          }).encode()
          req = request.Request(url, data=body, method="POST", headers={
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json",
          })
          try:
              with request.urlopen(req, timeout=45) as response:
                  result = json.loads(response.read(32768))
          except error.HTTPError as exc:
              # Never print the request URL: the RoutineHub API embeds its key in the path.
              raise SystemExit(f"RoutineHub rejected version creation (HTTP {exc.code}).")
          except (error.URLError, ValueError):
              raise SystemExit("Could not confirm a successful RoutineHub version creation.")
          if result.get("result") != "success":
              # RoutineHub can return HTTP 200 for API-level failures.
              raise SystemExit("RoutineHub reported an error; the version was not confirmed.")
          print(f"RoutineHub listing 26978 accepted version {os.environ['RELEASE_VERSION']}.")
          PY

      - name: Record the release so the app and Shortcut offer it
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ICLOUD_LINK: ${{ inputs.icloud_link }}
          RELEASE_CHANGES: ${{ inputs.changes }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          Path("shortcuts/release.json").write_text(json.dumps({
              "version": os.environ["RELEASE_VERSION"],
              "url": os.environ["ICLOUD_LINK"].strip(),
              "publishedAt": datetime.date.today().isoformat(),
              "notes": os.environ["RELEASE_CHANGES"][:180],
              "verified": True,
          }, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortcuts/release.json
          git commit -m "release: Rage Tracker Sync ${RELEASE_VERSION}"
          git pull --rebase origin main
          git push origin main
